[project]
name = "honestrag"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "markitdown[docx]>=0.1.8",
    "pdfplumber>=0.11.10",
    "pgvector>=0.4.1",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-ai-slim[openai]>=2.42.0",
    "pydantic-settings>=2.15.0",
    "sentence-transformers>=6.0.1",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# tests/eval is slow, needs a real corpus + embedding model, and is opt-in
# only (`uv run pytest tests/eval`) - never part of the default run.
addopts = "--ignore=tests/eval"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Raw XML/PDF-syntax string literals, not prose - wrapping them adds noise.
"tests/fixtures/make_fixtures.py" = ["E501"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

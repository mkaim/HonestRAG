<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RAG</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 3rem auto;
      padding: 0 1rem;
    }
    textarea {
      width: 100%;
      height: 6rem;
      font-size: 1rem;
      padding: 0.5rem;
      box-sizing: border-box;
    }
    button {
      margin-top: 0.5rem;
      padding: 0.5rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
    }
    #answer {
      margin-top: 1.5rem;
      white-space: pre-wrap;
      line-height: 1.4;
    }
    #risk {
      margin-top: 1rem;
      padding: 0.5rem 0.75rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    #risk.ok {
      background: #e6f4ea;
      color: #1e7b34;
    }
    #risk.warn {
      background: #fdecea;
      color: #b3261e;
    }
    #status {
      margin-top: 0.5rem;
      color: #666;
    }
    #stages {
      margin-top: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .stage {
      font-size: 0.85rem;
      color: #999;
    }
    .stage.running {
      color: #666;
    }
    .stage.done {
      color: #2a2;
    }
    details.debug {
      margin-top: 0.25rem;
      font-size: 0.75rem;
    }
    details.debug pre {
      white-space: pre-wrap;
      background: #f5f5f5;
      padding: 0.5rem;
      overflow-x: auto;
    }
    #extras {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #444;
    }
    #extras summary {
      cursor: pointer;
    }
    #extras pre {
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>Ask the corpus</h1>
  <textarea id="question" placeholder="Type your question..."></textarea>
  <br />
  <button id="send">Send</button>
  <div id="status"></div>
  <div id="stages"></div>
  <div id="risk" hidden></div>
  <div id="answer"></div>
  <details id="extras" hidden>
    <summary>Facts, verification &amp; completeness</summary>
    <pre id="extras-body"></pre>
  </details>

  <script>
    const question = document.getElementById("question");
    const send = document.getElementById("send");
    const status = document.getElementById("status");
    const stages = document.getElementById("stages");
    const answer = document.getElementById("answer");
    const extras = document.getElementById("extras");
    const extrasBody = document.getElementById("extras-body");
    const risk = document.getElementById("risk");

    const STAGE_LABELS = {
      decompose: "Decomposing question",
      search: "Searching corpus",
      answer: "Drafting answer",
      verify: "Verifying facts",
      completeness: "Checking completeness",
    };

    function stageEl(stage) {
      let el = document.getElementById("stage-" + stage);
      if (!el) {
        el = document.createElement("div");
        el.id = "stage-" + stage;
        el.className = "stage";
        stages.appendChild(el);
      }
      return el;
    }

    function renderStage(event) {
      const el = stageEl(event.stage);
      el.className = "stage " + event.status;
      const label = STAGE_LABELS[event.stage] || event.stage;
      el.textContent = `${label}: ${event.status}`;

      if (event.debug) {
        let dbg = el.querySelector("details.debug");
        if (!dbg) {
          dbg = document.createElement("details");
          dbg.className = "debug";
          dbg.innerHTML = "<summary>debug</summary><pre></pre>";
          el.appendChild(dbg);
        }
        dbg.querySelector("pre").textContent = JSON.stringify(event.debug, null, 2);
      }
    }

    async function ask() {
      const q = question.value.trim();
      if (!q) return;

      send.disabled = true;
      status.textContent = "Thinking...";
      stages.innerHTML = "";
      answer.textContent = "";
      extras.hidden = true;
      risk.hidden = true;

      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q }),
        });
        if (!res.ok) throw new Error(`Server error: ${res.status}`);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });

          let idx;
          while ((idx = buf.indexOf("\n\n")) !== -1) {
            const chunk = buf.slice(0, idx);
            buf = buf.slice(idx + 2);
            const line = chunk.split("\n").find((l) => l.startsWith("data: "));
            if (!line) continue;
            const event = JSON.parse(line.slice(6));

            if (event.stage === "final") {
              answer.textContent = event.data.answer;
              extrasBody.textContent = JSON.stringify(
                {
                  questions: event.data.questions,
                  facts: event.data.facts,
                  verification: event.data.verification,
                  completeness: event.data.completeness,
                },
                null,
                2,
              );
              extras.hidden = false;

              const answerHallucinated = event.data.facts.filter(
                (f) => !f.quote_verified,
              ).length;
              const verifyHallucinated =
                event.data.verification.hallucinated_quotes || 0;
              const total = answerHallucinated + verifyHallucinated;
              risk.hidden = false;
              if (total === 0) {
                risk.className = "ok";
                risk.textContent = "All cited quotes verified against source chunks.";
              } else {
                risk.className = "warn";
                risk.textContent =
                  `${total} unverifiable quote(s) detected ` +
                  `(${answerHallucinated} in the answer, ${verifyHallucinated} ` +
                  `in verification) - treat those facts as unsupported.`;
              }
            } else {
              renderStage(event);
            }
          }
        }
        status.textContent = "";
      } catch (err) {
        status.textContent = "Error: " + err.message;
      } finally {
        send.disabled = false;
      }
    }

    send.addEventListener("click", ask);
    question.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ask();
    });
  </script>
</body>
</html>
